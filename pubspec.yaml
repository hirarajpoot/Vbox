name: vbox
description: VBox — a V2Ray VPN/proxy client with an original dark UI.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  get: ^4.7.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  flutter_v2ray: ^1.0.10
  google_fonts: ^6.3.2
  http: ^1.5.0
  uuid: ^4.5.1
  mobile_scanner: ^7.1.3
  share_plus: ^11.1.0
  file_picker: ^10.3.3
  installed_apps: ^1.6.0
  permission_handler: ^12.0.1
  intl: ^0.20.2
  lucide_flutter: ^1.33.0
  webview_flutter: ^4.13.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
