<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="VBox — a V2Ray VPN/proxy client.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="VBox">
  <meta name="theme-color" content="#0B0908">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>VBox</title>
  <link rel="manifest" href="manifest.json">
</head>
<body style="margin:0;background:#17110C;color:#F6EDE3;font-family:Georgia,serif;">
  <div id="boot" style="min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;background:
    radial-gradient(ellipse 80% 55% at 50% 28%, rgba(224,138,61,0.42) 0%, transparent 58%),
    radial-gradient(ellipse 55% 45% at 8% 92%, rgba(196,92,38,0.36) 0%, transparent 55%),
    radial-gradient(ellipse 45% 40% at 94% 8%, rgba(240,179,106,0.26) 0%, transparent 50%),
    linear-gradient(155deg, #2C1C14 0%, #17110C 48%, #22150F 100%);">
    <div style="width:88px;height:88px;border-radius:24px;border:1px solid #E08A3D;display:flex;align-items:center;justify-content:center;color:#E08A3D;font-size:42px;font-weight:700;letter-spacing:1px;box-shadow:0 0 36px rgba(224,138,61,0.28);">V</div>
    <div style="margin-top:22px;font-size:28px;letter-spacing:4px;font-weight:700;">VBox</div>
    <div style="margin-top:8px;font-size:11px;letter-spacing:2px;color:#A89888;">SECURE TUNNEL</div>
  </div>
  <script>
    (function () {
      var allowed = {
        '': true, '#': true, '#/': true,
        '#/splash': true, '#/onboarding': true, '#/home': true,
        '#/add-subscription': true, '#/import': true, '#/qr-scan': true,
        '#/manual-add': true, '#/server-detail': true, '#/tunnel': true,
        '#/dns': true, '#/routing': true, '#/per-app': true,
        '#/subscriptions': true, '#/speed-test': true, '#/language': true,
        '#/logs': true, '#/about': true, '#/privacy': true, '#/backup': true
      };
      var path = (location.hash || '').split('?')[0];
      if (path && !allowed[path]) {
        history.replaceState(null, '', location.pathname + location.search + '#/splash');
      }
    })();
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
